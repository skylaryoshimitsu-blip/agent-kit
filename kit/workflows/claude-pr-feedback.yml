# agent-kit: respond to the reviewer's PR feedback automatically, and notify them in Discord.
# Installed by agent-kit/install-workflow.sh. Remove: delete this file and the repo secrets
# CLAUDE_CODE_OAUTH_TOKEN, DISCORD_TEAM_WEBHOOK, DISCORD_LOG_WEBHOOK, DISCORD_APPROVALS_WEBHOOK.
name: agent-kit PR feedback

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, ready_for_review]
  issues:
    types: [opened]

env:
  OWNER: "__OWNER__"           # Golden's GitHub login
  REVIEWER: "__REVIEWER__"     # the client developer's GitHub login
  REVIEWER_DISCORD_ID: "__REVIEWER_DISCORD_ID__"

jobs:
  # Cheap notifications — no Claude run needed.
  notify:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.user.login == '__OWNER__' && !github.event.pull_request.draft) ||
      (github.event_name == 'pull_request_review' && github.event.review.user.login == '__OWNER__' && github.event.review.state == 'approved')
    steps:
      - name: Tell the reviewer in Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_TEAM_WEBHOOK }}
          EVENT: ${{ github.event_name }}
          NUM: ${{ github.event.pull_request.number }}
          URL: ${{ github.event.pull_request.html_url }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          if [ "$EVENT" = "pull_request" ]; then msg="PR #$NUM ready for your review — $URL"
          else msg="PR #$NUM approved, ready to merge — $URL"; fi
          jq -n --arg c "<@$REVIEWER_DISCORD_ID> $msg" --arg u "$REVIEWER_DISCORD_ID" \
            '{content:$c, allowed_mentions:{parse:[], users:[$u]}}' > payload.json
          curl -sS --max-time 15 -H 'Content-Type: application/json' -d @payload.json "$WEBHOOK" >/dev/null

  # Claude: the reviewer's feedback on Golden's PRs (no tag needed), or "@claude" from Golden/reviewer.
  claude:
    runs-on: ubuntu-latest
    if: >-
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.login == '__REVIEWER__' &&
          (github.event.issue.user.login == '__OWNER__' || github.event.issue.user.login == 'claude[bot]')) ||
        (github.event_name == 'pull_request_review_comment' && github.event.comment.user.login == '__REVIEWER__' &&
          (github.event.pull_request.user.login == '__OWNER__' || github.event.pull_request.user.login == 'claude[bot]')) ||
        (github.event_name == 'pull_request_review' && github.event.review.user.login == '__REVIEWER__' &&
          github.event.review.state != 'approved' &&
          (github.event.pull_request.user.login == '__OWNER__' || github.event.pull_request.user.login == 'claude[bot]'))
      ) || (
        contains(fromJSON('["__OWNER__","__REVIEWER__"]'), github.actor) && (
          (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
          (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')))
      )
    concurrency:
      group: agent-kit-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: anthropics/claude-code-action@v1
        env:
          DISCORD_TEAM_WEBHOOK: ${{ secrets.DISCORD_TEAM_WEBHOOK }}
          DISCORD_LOG_WEBHOOK: ${{ secrets.DISCORD_LOG_WEBHOOK }}
          DISCORD_APPROVALS_WEBHOOK: ${{ secrets.DISCORD_APPROVALS_WEBHOOK }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are running in GitHub Actions for repository ${{ github.repository }}.
            Event: ${{ github.event_name }} by @${{ github.actor }} on #${{ github.event.issue.number || github.event.pull_request.number }}.
            Follow CLAUDE.md (which imports .agent-kit/CLAUDE.md) and agent-profile.yaml.
            - If this is feedback from @__REVIEWER__ on a pull request: follow .claude/commands/address-feedback.md for that PR.
            - If this is an "@claude" request: read the comment or issue with `gh`, then follow .claude/commands/fix.md or feature.md as fits; open a PR for any code change.
            Discord: `bash .agent-kit/hooks/discord-post.sh <team|logs|approvals> [--mention __REVIEWER_DISCORD_ID__] "message"`.
            Never approve or merge a pull request. Never print secret values.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh pr:*),Bash(gh api:*),Bash(gh issue:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(node:*),Bash(python3:*),Bash(bash .agent-kit/hooks/:*),Bash(jq:*),Bash(ls:*),Bash(cat:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh pr review --approve:*),Bash(git push --force:*),Bash(git push -f:*)"
