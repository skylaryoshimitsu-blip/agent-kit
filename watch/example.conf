# Copy to ~/.agent-kit/watch/<name>.conf (e.g. drscc.conf). Not secret — webhooks go in
# ~/.agent-kit/secrets.env instead.
REPO="owner/repo"                       # the client repo on GitHub
LOCAL_PATH="$HOME/code/repo"            # your local clone of it
OWNER="your-github-login"               # PRs you open
REVIEWER="their-github-login"           # whose comments trigger the agent
REVIEWER_DISCORD_ID="000000000000000000" # tagged in the shared channel
HOURS="21-06"                           # your local working hours (wraps past midnight)
DAYS="1,2,3,4,5"                        # days a shift starts, 1=Mon … 7=Sun
INTERVAL=150                            # seconds between checks
# PROFILE="$HOME/.agent-kit/profiles/<name>.yaml"   # default location
